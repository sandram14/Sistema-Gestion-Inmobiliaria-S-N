# =====================================================================
# S&N Inmobiliaria - Docker Compose (Fase 16: sistema completo)
# =====================================================================
#   db             PostgreSQL 16 + PostGIS 3.4
#   imagenes-init  copia una vez las fotos iniciales al volumen (sin sobrescribir)
#   backend        API Java en Tomcat (solo accesible a través de web)
#   web            nginx: sitio público en /, panel en /admin/, y /api y /uploads al backend
#
# Uso (desde la raíz del repositorio):
#   docker compose -f docker/docker-compose.yml up -d --build
#   abrir http://localhost   (o http://localhost:<WEB_PORT>)
# Las variables se leen de docker/.env (copiar desde docker/.env.example). Ver docker/README.md.
#
# Los volúmenes son EXTERNOS: Compose los usa pero nunca los crea ni los borra
# (ni siquiera con "down -v"). En una instalación nueva se crean una vez con
# "docker volume create" (ver README).
# =====================================================================
name: sn-inmobiliaria

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Definir DB_NAME en docker/.env}
      POSTGRES_USER: ${DB_USER:?Definir DB_USER en docker/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en docker/.env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: America/Asuncion
      PGTZ: America/Asuncion
    ports:
      # Puerto 5433 en la PC: lo usan las pruebas de integración (mvn) y el Tomcat de desarrollo
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database:/database:ro
      - ./db/00_init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  imagenes-init:
    image: alpine:3.20
    # Copia database/seed/imagenes al volumen SIN SOBRESCRIBIR y verifica las huellas SHA-256.
    # Si las fotos ya están (instalación existente), no copia nada.
    command: ["sh", "/database/migraciones/001_copiar_al_volumen.sh"]
    volumes:
      - imagenes:/destino
      - ../database:/database:ro
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: sn-inmobiliaria-backend:local
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-produccion}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      UPLOAD_DIR: /data/uploads
      TZ: America/Asuncion
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ORIGENES_PERMITIDOS: ${APP_ORIGENES_PERMITIDOS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-}
      GEMINI_TIMEOUT_SEGUNDOS: ${GEMINI_TIMEOUT_SEGUNDOS:-}
      ASISTENTE_LIMITE_MINUTO_SESION: ${ASISTENTE_LIMITE_MINUTO_SESION:-}
      ASISTENTE_LIMITE_DIA_SESION: ${ASISTENTE_LIMITE_DIA_SESION:-}
      ASISTENTE_LIMITE_MINUTO_GLOBAL: ${ASISTENTE_LIMITE_MINUTO_GLOBAL:-}
      ASISTENTE_LIMITE_DIA_GLOBAL: ${ASISTENTE_LIMITE_DIA_GLOBAL:-}
    volumes:
      - imagenes:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      imagenes-init:
        condition: service_completed_successfully
    healthcheck:
      # /api/health responde 200 solo si Hibernate y la base están disponibles
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: sn-inmobiliaria-web:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  # Datos de PostgreSQL (propiedades, usuarios, consultas, metadatos de imágenes)
  pgdata:
    name: sn-inmobiliaria_pgdata
    external: true
  # Fotos de propiedades (UPLOAD_DIR del backend): las mismas para el sitio y el panel
  imagenes:
    name: sn-uploads
    external: true
