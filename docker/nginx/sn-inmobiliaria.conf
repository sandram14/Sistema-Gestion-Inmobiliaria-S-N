# =====================================================================
# nginx - S&N Inmobiliaria
# =====================================================================
#   /           sitio público (React, compilado)
#   /admin/     panel administrativo (React, compilado)
#   /api/       API Java (backend, Tomcat)
#   /uploads/   fotos de propiedades (backend, volumen compartido sn-uploads)
#
# Sitio y panel están en el MISMO dominio: comparten las fotos de /uploads/ y la cookie
# de sesión del panel funciona sin configuración adicional.
# =====================================================================

upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Fotos de hasta 5 MB (más el resto del formulario). Con el valor por defecto
    # de nginx (1 MB) las subidas desde el panel serían rechazadas.
    client_max_body_size 6m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

    include /etc/nginx/snippets/seguridad.conf;

    # ---- Backend ----
    # Host original: el backend compara la cabecera Origin con Host para rechazar
    # peticiones de otros sitios (AuthFilter). $http_host conserva también el puerto.
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El asistente puede tardar (Gemini + un reintento)
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Panel administrativo ----
    location = /admin {
        return 301 /admin/;
    }

    # Archivos compilados con nombre único (hash): se pueden guardar en caché un año
    location /admin/assets/ {
        alias /usr/share/nginx/admin/assets/;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rutas internas del panel (/admin/propiedades/12): las resuelve React
    location /admin/ {
        alias /usr/share/nginx/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin/index.html {
        alias /usr/share/nginx/admin/index.html;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache";
    }

    # ---- Sitio público ----
    root /usr/share/nginx/sitio;

    location /assets/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rutas internas del sitio (/buscar, /servicios): las resuelve React
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache";
    }
}
